<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KRIO Color Palette</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #DDE3EA; color: #0F1B2A; }
    header.page { padding: 24px 24px 8px; }
    header.page h1 { margin: 0 0 4px; font-size: 22px; }
    header.page p { margin: 0; color: #4A5A6E; max-width: 72ch; }
    .themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(520px, 1fr)); gap: 16px; padding: 16px 24px 32px; }
    @media (max-width: 600px) { .themes { grid-template-columns: 1fr; padding: 16px; } }

    .theme { background: var(--color-bg); color: var(--color-text); border-radius: 12px; padding: 20px; }
    .theme h2 { margin: 0 0 16px; font-size: 18px; }
    .theme h3 { margin: 20px 0 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); }

    .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
    .swatch { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; overflow: hidden; }
    .swatch .chip { height: 44px; border-bottom: 1px solid var(--color-border); }
    .swatch .meta { padding: 6px 8px; font-size: 11px; line-height: 1.35; }
    .swatch .meta code { color: var(--color-text-secondary); }

    .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 14px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
    .card-head { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
    .card-title { font-weight: 600; }
    .card-sub { color: var(--color-text-secondary); font-size: 12px; }
    .temp { font-size: 26px; font-weight: 700; margin: 8px 0 2px; font-variant-numeric: tabular-nums; }
    .card[data-status="safe"] { border-left: 4px solid var(--color-safe); }
    .card[data-status="warning"] { border-left: 4px solid var(--color-warning); }
    .card[data-status="critical"] { border-left: 4px solid var(--color-critical); }
    .card[data-status="offline"] { border-left: 4px solid var(--color-offline); }

    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .badge.safe { background: var(--color-safe-bg); color: var(--color-safe-fg); }
    .badge.warning { background: var(--color-warning-bg); color: var(--color-warning-fg); }
    .badge.critical { background: var(--color-critical-bg); color: var(--color-critical-fg); }
    .badge.info { background: var(--color-info-bg); color: var(--color-info-fg); }
    .badge.offline { background: var(--color-offline-bg); color: var(--color-offline-fg); }

    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 14px; border: 1px solid transparent; cursor: pointer; }
    .btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .btn-secondary { background: var(--color-surface); color: var(--color-text); border-color: var(--color-border-strong); }
    .btn:focus-visible, .input:focus-visible, a:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }
    .input { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--color-border-strong); background: var(--color-surface); color: var(--color-text); }
    .input::placeholder { color: var(--color-text-secondary); }
    a { color: var(--color-primary); }

    table { width: 100%; border-collapse: collapse; background: var(--color-surface); border-radius: 8px; overflow: hidden; font-size: 12px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--color-border); }
    th { background: var(--color-surface-muted); }
    td.num { font-variant-numeric: tabular-nums; }
    .pair { display: inline-block; padding: 1px 6px; border-radius: 4px; font-weight: 600; }
  </style>
</head>
<body>
  <header class="page">
    <h1>KRIO Color Palette</h1>
    <p>Token warna untuk light mode dan dark mode. Rasio kontras di tabel dihitung langsung dari nilai pada <code>tokens.css</code> memakai rumus WCAG 2.2. Status suhu selalu ditampilkan dengan ikon dan teks, tidak hanya warna.</p>
  </header>

  <main class="themes">
    <section class="theme" data-theme="light" aria-label="Light mode"></section>
    <section class="theme" data-theme="dark" aria-label="Dark mode"></section>
  </main>

  <template id="theme-template">
    <h2></h2>

    <h3>Permukaan, teks, dan merek</h3>
    <div class="swatches" data-group="base"></div>

    <h3>Status</h3>
    <div class="swatches" data-group="status"></div>

    <h3>Contoh komponen</h3>
    <div class="cards">
      <div class="card" data-status="safe">
        <div class="card-head"><div><div class="card-title">Boks A-01</div><div class="card-sub">LoRa · Gudang Muara</div></div><span class="badge safe">● Aman</span></div>
        <div class="temp">2.4 °C</div><div class="card-sub">Rentang produk 0–4 °C</div>
      </div>
      <div class="card" data-status="warning">
        <div class="card-head"><div><div class="card-title">Boks B-04</div><div class="card-sub">Seluler · Truk L-2213</div></div><span class="badge warning">▲ Waspada</span></div>
        <div class="temp">3.8 °C</div><div class="card-sub">Diprediksi melewati ambang &lt; 40 mnt</div>
      </div>
      <div class="card" data-status="critical">
        <div class="card-head"><div><div class="card-title">Boks C-07</div><div class="card-sub">Seluler · Truk B-9081</div></div><span class="badge critical">✕ Kritis</span></div>
        <div class="temp">6.1 °C</div><div class="card-sub">Di atas ambang sejak 12 mnt</div>
      </div>
      <div class="card" data-status="offline">
        <div class="card-head"><div><div class="card-title">Boks C-02</div><div class="card-sub">LoRa · Gudang Muara</div></div><span class="badge offline">○ Offline</span></div>
        <div class="temp">3.0 °C</div><div class="card-sub">Terakhir terlihat 2 jam lalu</div>
      </div>
    </div>
    <div class="controls" style="margin-top:12px">
      <button class="btn btn-primary" type="button">Unduh laporan</button>
      <button class="btn btn-secondary" type="button">Batal</button>
      <input class="input" placeholder="Cari label / device id" aria-label="Cari perangkat">
      <span class="badge info">ⓘ Data tersinkronisasi</span>
      <a href="#">Lihat detail</a>
    </div>

    <h3>Rasio kontras (WCAG 2.2 AA)</h3>
    <table>
      <thead><tr><th>Pasangan</th><th>Rasio</th><th>Min.</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>
  </template>

  <script>
    const BASE = [
      ['bg', 'Latar halaman'], ['surface', 'Kartu'], ['surface-muted', 'Kartu redup'],
      ['text', 'Teks utama'], ['text-secondary', 'Teks sekunder'],
      ['border', 'Garis'], ['border-strong', 'Garis komponen'],
      ['primary', 'Primer'], ['primary-hover', 'Primer hover'], ['on-primary', 'Teks di primer'],
      ['accent', 'Aksen'], ['focus', 'Fokus'],
    ];
    const STATUS = [['safe', 'Aman'], ['warning', 'Waspada'], ['critical', 'Kritis'], ['info', 'Info'], ['offline', 'Offline']];

    // [depan, latar, minimum]. 4.5 untuk teks biasa, 3 untuk komponen UI dan grafik.
    const PAIRS = [
      ['text', 'bg', 4.5], ['text', 'surface', 4.5], ['text', 'surface-muted', 4.5],
      ['text-secondary', 'bg', 4.5], ['text-secondary', 'surface', 4.5], ['text-secondary', 'surface-muted', 4.5],
      ['on-primary', 'primary', 4.5], ['on-primary', 'primary-hover', 4.5],
      ['primary', 'surface', 4.5], ['primary', 'bg', 4.5],
      ['accent', 'surface', 3], ['border-strong', 'surface', 3],
      ['focus', 'bg', 3], ['focus', 'surface', 3],
      ...STATUS.flatMap(([s]) => [[`${s}-fg`, `${s}-bg`, 4.5], [s, 'surface', 3], [s, 'bg', 3]]),
    ];

    function luminance(hex) {
      const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
        .map(c => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }
    function contrast(a, b) {
      const [hi, lo] = [luminance(a), luminance(b)].sort((x, y) => y - x);
      return (hi + 0.05) / (lo + 0.05);
    }

    function swatch(value, token, label) {
      const el = document.createElement('div');
      el.className = 'swatch';
      el.innerHTML = `<div class="chip" style="background:${value}"></div>
        <div class="meta"><strong>${label}</strong><br><code>--color-${token}</code><br><code>${value}</code></div>`;
      return el;
    }

    const template = document.getElementById('theme-template');
    for (const section of document.querySelectorAll('.theme')) {
      section.append(template.content.cloneNode(true));
      section.querySelector('h2').textContent = section.dataset.theme === 'light' ? 'Light mode' : 'Dark mode';
      const style = getComputedStyle(section);
      const token = name => style.getPropertyValue(`--color-${name}`).trim();

      const base = section.querySelector('[data-group="base"]');
      BASE.forEach(([name, label]) => base.append(swatch(token(name), name, label)));
      const status = section.querySelector('[data-group="status"]');
      STATUS.forEach(([name, label]) => {
        status.append(swatch(token(name), name, label));
        status.append(swatch(token(`${name}-bg`), `${name}-bg`, `${label} latar`));
        status.append(swatch(token(`${name}-fg`), `${name}-fg`, `${label} teks`));
      });

      const tbody = section.querySelector('tbody');
      for (const [fg, bg, min] of PAIRS) {
        const ratio = contrast(token(fg), token(bg));
        const pass = ratio >= min;
        const row = document.createElement('tr');
        row.innerHTML = `<td><span class="pair" style="color:${token(fg)};background:${token(bg)}">Aa</span> ${fg} / ${bg}</td>
          <td class="num">${ratio.toFixed(2)} : 1</td><td class="num">${min}</td><td>${pass ? '✓ Lulus' : '✕ Gagal'}</td>`;
        tbody.append(row);
      }
    }
  </script>
</body>
</html>
