# Alembic Configuration — KRIO
#
# Jalankan migration:
#   alembic upgrade head          # apply semua migrasi
#   alembic downgrade -1          # rollback 1 versi
#   alembic revision --autogenerate -m "description"  # buat migrasi baru

[alembic]
script_location = alembic
prepend_sys_path = .

# Database URL — override via env var DATABASE_URL
# Format: postgresql+asyncpg://user:pass@host:5432/dbname
# Untuk sync: postgresql://user:pass@host:5432/dbname
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/krio_dev

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
